function slider(n){const g=$("#grid"),d=$("#dots"),pv=$("#prev"),nx=$("#next"),ht=$("#hint");g.scrollLeft=0;
  g.classList.toggle("multi",n>1);g.classList.remove("nudge");ht.hidden=n<2;
  const step=()=>{const c=g.firstElementChild;return c?c.offsetWidth+16:1};
  let touched=false;const stopHint=()=>{if(touched)return;touched=true;ht.hidden=true;g.classList.remove("nudge")};
  ["pointerdown","touchstart","wheel"].forEach(ev=>g.addEventListener(ev,stopHint,{once:true,passive:true}));
  clearTimeout(slider.t);if(n>1)slider.t=setTimeout(()=>{if(!touched)g.classList.add("nudge")},900);
  d.innerHTML=n>1?Array.from({length:n},(_,i)=>`<button aria-label="Sản phẩm ${i+1}"></button>`).join(""):"";
  pv.hidden=nx.hidden=n<2;
  const idx=()=>Math.round(g.scrollLeft/step());
  const go=i=>{stopHint();g.scrollTo({left:Math.max(0,Math.min(n-1,i))*step()})};
  const sync=()=>{const i=idx();if(i>0)stopHint();[...d.children].forEach((b,k)=>b.classList.toggle("on",k===i));pv.disabled=i<=0;nx.disabled=i>=n-1};
  [...d.children].forEach((b,k)=>b.onclick=()=>go(k));
  pv.onclick=()=>go(idx()-1);nx.onclick=ht.onclick=()=>go(idx()+1);
  g.onscroll=()=>{cancelAnimationFrame(slider.f);slider.f=requestAnimationFrame(sync)};
  g.onkeydown=e=>{if(e.key==="ArrowRight"){e.preventDefault();go(idx()+1)}if(e.key==="ArrowLeft"){e.preventDefault();go(idx()-1)}};
  sync()}

  <aside class="side"><section class="box buy">
    ${goi.length>1?`<div class="pk">${goi.map((x,i)=>`<button data-g="${i}" class="${i?"":"on"}"><b>${esc(x.ten)}</b><small>${esc(priceOf(x))}</small></button>`).join("")}</div>`:""}
    <div class="price" id="bigPrice">${priceHtml(g)}</div><div class="old" id="goiInfo">${esc([g.ten,g.mo_ta].filter(Boolean).join(" · "))}</div>
    <button class="btn" id="buy">Sử dụng ngay ${ICON.arrow}</button>
    <ul class="trust"><li>${ICON.bolt}Trả bằng mã QR, không cần thẻ</li><li>${ICON.chat}Hỗ trợ qua Zalo${SITE.zalo?" "+esc(SITE.zalo):""}</li><li>${ICON.shield}Mua một lần, không thu phí hàng tháng</li></ul>
  </section></aside></div>
  <div class="sticky"><span class="price" id="stPrice">${priceHtml(g)}</span><button class="btn" id="buy2">Sử dụng ngay</button></div>`;
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{GI=+b.dataset.g;document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("on",x===b));const x=goi[GI];$("#bigPrice").innerHTML=priceHtml(x);$("#stPrice").innerHTML=priceHtml(x);$("#goiInfo").textContent=[x.ten,x.mo_ta].filter(Boolean).join(" · ")});
  $("#buy").onclick=$("#buy2").onclick=()=>openPay(p,goi[GI]||{})}
/* ---------- thanh toán ---------- */
const orderCode=p=>(p.ma||"SONA")+" "+Date.now().toString(36).slice(-5).toUpperCase();
function qrUrl(g,info){const t=SITE.thanh_toan||{};if(!t.ngan_hang||!t.so_tai_khoan)return"";
  return`https://img.vietqr.io/image/${encodeURIComponent(t.ngan_hang)}-${encodeURIComponent(t.so_tai_khoan)}-compact2.png?amount=${g.so_tien||""}&addInfo=${encodeURIComponent(info)}&accountName=${encodeURIComponent(t.ten_tai_khoan||"")}`}
function openPay(p,g){noteProduct(p,3);const code=orderCode(p);const t=SITE.thanh_toan||{};const u=qrUrl(g,code);
  const msg=`Chào SONA, em đã chuyển khoản mã đơn ${code} (${p.ten}).`;
  $("#panel").innerHTML=`<div class="panel-h"><h3 id="payTitle">Thanh toán ${esc(priceOf(g))}</h3><button class="x" id="x" aria-label="Đóng">×</button></div>
  <div class="muted">${esc(p.ten)}</div>
  ${u?`<div class="stp">Bước 1 · Quét mã bằng app ngân hàng</div><div class="qr"><img alt="Mã QR thanh toán ${esc(priceOf(g))}" src="${u}"></div>
  <div class="kv"><div><span>Ngân hàng</span><b>${esc(t.ten_ngan_hang||"")}</b></div><div><span>Số tài khoản</span><b>${esc(t.so_tai_khoan)}</b><button class="cp" data-cp="${esc(t.so_tai_khoan)}">Chép</button></div><div><span>Chủ tài khoản</span><b>${esc(t.ten_tai_khoan||"")}</b></div><div><span>Nội dung</span><b>${esc(code)}</b><button class="cp" data-cp="${esc(code)}">Chép</button></div></div>
  <div class="stp">Bước 2 · Nhắn Zalo để nhận sản phẩm</div><p class="muted" style="margin:0 0 12px">Chuyển xong, anh chị bấm nút dưới và gửi tin có mã đơn <b style="color:var(--t)">${esc(code)}</b>. SONA gửi sản phẩm qua Zalo trong giờ làm việc 8h–20h.</p>
  ${zaloUrl()?`<a class="btn" id="zl" href="${zaloUrl()}" target="_blank" rel="noopener">Nhắn Zalo SONA</a>`:""}`
  :`<p class="muted">Web chưa có thông tin nhận tiền.</p>`}`;
  $("#x").onclick=closePay;document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp));
  const zl=$("#zl");if(zl)zl.onclick=()=>{try{navigator.clipboard.writeText(msg).then(()=>toast("Đã chép tin nhắn, dán vào Zalo"),()=>{})}catch(e){}};
  $("#sheet").classList.add("open");document.body.style.overflow="hidden";$("#x").focus()}
function closePay(){$("#sheet").classList.remove("open");document.body.style.overflow=""}
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closePay()};
addEventListener("keydown",e=>{if(e.key==="Escape")closePay()});
addEventListener("hashchange",route);load();
</script></body></html>
