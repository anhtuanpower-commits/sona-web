<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SONA AI</title>
<meta name="description" content="SONA AI: công cụ AI, app, tài liệu và khóa học đơn giản cho spa, salon, shop và hộ kinh doanh.">
<meta name="theme-color" content="#F4F1E9">
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/mark-192.png">
<meta property="og:image" content="img/logo-full.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens (Đặc tả SONA AI V1.0) ============ */
:root{
  /* Màu */
  --black:#080B0D;--gold:#DDB66A;--gold-press:#C9A157;--emerald:#12332F;
  --ivory:#F4F1E9;--white:#FFFFFF;--gray:#737A80;--line:#E5E1D8;--line-d:#303638;
  --ink:#15191B;--ink-2:#41474B;--on-dark:#F4F1E9;--on-dark-2:#A9B0B3;
  /* Chữ */
  --font:"Be Vietnam Pro",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --h1:clamp(34px,4.4vw,56px);--h2:clamp(26px,3vw,38px);--h3:clamp(18px,1.6vw,22px);
  --body:clamp(15px,1.05vw,16px);--small:13px;
  /* Khoảng cách */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:72px;--s9:112px;
  --gutter:clamp(16px,4vw,40px);--maxw:1180px;
  /* Bo góc */
  --r-card:20px;--r-box:24px;--r-input:12px;--r-pill:999px;
  /* Bóng */
  --sh-1:0 1px 2px rgba(8,11,13,.04),0 4px 16px rgba(8,11,13,.04);
  --sh-2:0 2px 4px rgba(8,11,13,.05),0 12px 32px rgba(8,11,13,.08);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--font);font-size:var(--body);line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.muted{color:var(--gray)}
.eyebrow{font-size:var(--small);font-weight:500;color:var(--gray);letter-spacing:.02em}
.sec{padding-block:var(--s9)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s4) var(--s6);margin-bottom:var(--s7)}
.sec-head h2{font-size:var(--h2);line-height:1.15}
.sec-head p{margin-top:var(--s3);color:var(--gray);max-width:38em}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);min-height:44px}
.link svg{width:16px;height:16px;transition:transform .2s var(--ease)}
.link:hover svg{transform:translateX(3px)}
.ph{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--ink-2);background:#EFEAE0;border:1px dashed #CFC7B6;border-radius:var(--r-pill);padding:2px 9px}
.hero .ph,.media .ph{color:var(--on-dark-2);background:transparent;border-color:var(--line-d)}

/* ---------- Nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--r-pill);border:1px solid transparent;font-weight:500;font-size:15px;cursor:pointer;transition:background .2s var(--ease),border-color .2s,box-shadow .2s,transform .1s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--gold);color:var(--black)}
.btn-primary:hover{background:#E4C27E;box-shadow:0 6px 20px rgba(221,182,106,.28)}
.btn-primary:active{background:var(--gold-press);transform:scale(.98)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--white);border-color:#D4CEC2}
.btn-ghost:active{transform:scale(.98)}
.hero .btn-ghost{color:var(--on-dark);border-color:var(--line-d)}
.hero .btn-ghost:hover{background:#12171A;border-color:#454c4f}
.btn-dark{background:var(--black);color:var(--on-dark)}
.btn-dark:hover{background:#1A2023}
.btn-dark:active{transform:scale(.98)}
.btn[disabled]{background:#E9E5DC;color:#868B8F;border-color:transparent;cursor:not-allowed;box-shadow:none;transform:none}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:rgba(8,11,13,.05)}
.icon-btn svg{width:20px;height:20px}

/* ---------- Header ---------- */
.hdr{position:sticky;top:0;z-index:30;background:rgba(244,241,233,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;gap:var(--s4)}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:.06em;min-height:44px}
.logo img{width:32px;height:32px;border-radius:9px}
.logo b{font-weight:300;letter-spacing:.04em;color:var(--gray);margin-left:4px}
.nav{display:flex;gap:var(--s1)}
.nav a{padding:10px 16px;border-radius:var(--r-pill);font-size:15px;color:var(--ink-2);transition:color .2s,background .2s}
.nav a:hover{color:var(--ink);background:rgba(8,11,13,.04)}
.nav a.on{color:var(--ink);font-weight:500}
.hdr-r{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2)}
.hdr-r .btn{min-height:40px;padding:0 18px;font-size:14px}
.menu-btn{display:none!important}
@media(max-width:1023px){
  .hdr-in{grid-template-columns:1fr auto}
  .nav,.hdr-r .btn{display:none}
  .menu-btn{display:grid!important}
}
.drawer{position:fixed;inset:64px 0 0;z-index:29;background:var(--ivory);padding:var(--s5) var(--gutter) calc(var(--s6) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s2);overflow:auto}
.drawer a.item{display:flex;align-items:center;justify-content:space-between;font-size:22px;font-weight:400;padding:14px 4px;border-bottom:1px solid var(--line);min-height:56px}
.drawer a.item svg{width:18px;height:18px;color:var(--gray)}
.drawer .btn{margin-top:var(--s5)}

/* ---------- Tìm kiếm ---------- */
.search-ov{position:fixed;inset:0;z-index:50;background:rgba(8,11,13,.32);display:flex;justify-content:center;align-items:flex-start;padding:84px var(--gutter) 0}
.search-box{width:100%;max-width:640px;background:var(--white);border-radius:var(--r-box);box-shadow:var(--sh-2);padding:var(--s3)}
.field{position:relative}
.field svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--gray);pointer-events:none}
.input{width:100%;height:52px;border-radius:var(--r-input);border:1px solid var(--line);background:var(--white);padding:0 16px 0 46px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.input:focus{border-color:#BFA36A;box-shadow:0 0 0 4px rgba(221,182,106,.2)}
.input::-webkit-search-cancel-button{display:none}
.sugg{display:grid;margin-top:var(--s2)}
.sugg a{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:12px;border-radius:var(--r-input);min-height:48px}
.sugg a:hover,.sugg a:focus-visible{background:var(--ivory)}
.sugg small{color:var(--gray);white-space:nowrap}
.sugg .none{padding:12px;color:var(--gray)}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--black);color:var(--on-dark)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 70% at 78% 40%,rgba(18,51,47,.85),transparent 70%),
  radial-gradient(30% 30% at 80% 30%,rgba(221,182,106,.08),transparent 70%);pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:var(--s7);align-items:center;padding-block:var(--s8) calc(var(--s8) + 40px)}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:var(--h1);line-height:1.08;margin-top:var(--s4);max-width:13em}
.hero .lead{margin-top:var(--s5);font-size:clamp(16px,1.3vw,18px);font-weight:300;color:var(--on-dark-2);max-width:32em;line-height:1.65}
.hero .ctas{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s6)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s5);margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid var(--line-d);max-width:520px}
.stat b{display:block;font-size:clamp(22px,2.2vw,28px);font-weight:400;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:var(--small);color:var(--on-dark-2);margin-top:2px}
.stats-note{grid-column:1/-1;margin-top:-8px}
.device{justify-self:center;position:relative;width:min(300px,78vw);margin:0}
.phone{position:relative;border-radius:46px;padding:10px;background:#15191B;border:1px solid var(--line-d);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.phone .scr{border-radius:36px;overflow:hidden;aspect-ratio:390/844;background:#f4f6fb}
.phone .scr img{width:100%;height:100%;object-fit:cover;object-position:top}
.device figcaption{margin-top:var(--s4);text-align:center;font-size:var(--small);color:var(--on-dark-2)}
.device figcaption a{color:var(--on-dark);border-bottom:1px solid var(--line-d)}

/* ---------- Giá trị ---------- */
.values-wrap{margin-top:-40px;position:relative;z-index:2}
.values{background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);box-shadow:var(--sh-1);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.value{padding:var(--s6) var(--s5);display:grid;gap:var(--s2);align-content:start}
.value+.value{border-left:1px solid var(--line)}
.value .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ivory);color:var(--emerald);margin-bottom:var(--s2)}
.value .ic svg{width:20px;height:20px}
.value h3{font-size:17px;font-weight:500;letter-spacing:-.01em}
.value p{color:var(--gray);font-size:14px;line-height:1.55}

/* ---------- Thẻ sản phẩm ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s5)}
.pcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-1);transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.pcard:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.media{aspect-ratio:16/10;background:var(--black);position:relative;overflow:hidden;display:block}
.media img{width:100%;height:100%;object-fit:cover}
.media.empty{display:grid;place-items:center;background:linear-gradient(160deg,var(--emerald),var(--black) 75%);color:var(--on-dark-2)}
.media.empty .in{display:grid;justify-items:center;gap:10px;text-align:center;padding:var(--s4)}
.media.empty svg{width:40px;height:40px;color:var(--gold);opacity:.9}
.pcard .body{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;color:var(--ink-2);background:var(--ivory);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px}
.tag.soon{color:var(--emerald);background:#E7EFEC;border-color:#CFE0DA}
.pcard h3{font-size:var(--h3);line-height:1.3}
.pcard .desc{color:var(--gray);font-size:15px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ticks li{display:flex;gap:10px;font-size:14px;color:var(--ink-2);line-height:1.5}
.ticks li svg{flex:none;width:16px;height:16px;margin-top:3px;color:var(--emerald)}
.pcard .ticks li span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .foot{margin-top:auto;padding-top:var(--s4);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.price{font-size:20px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.price s{font-size:14px;font-weight:400;color:var(--gray);margin-left:8px}
.price small{display:block;font-size:12px;font-weight:400;color:var(--gray);letter-spacing:0}
.pcard .btn{min-height:44px;padding:0 18px;font-size:14px}

/* ---------- Mua hàng ---------- */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s6);position:relative;list-style:none;margin:0;padding:0}
.steps::before{content:"";position:absolute;top:28px;left:calc(16.66% + 36px);right:calc(16.66% + 36px);height:1px;background:var(--line)}
.step{text-align:center;display:grid;justify-items:center;align-content:start;gap:var(--s2);position:relative}
.step .ic{width:56px;height:56px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--emerald);box-shadow:var(--sh-1);margin-bottom:var(--s2)}
.step .ic svg{width:22px;height:22px}
.step .n{font-size:var(--small);color:var(--gray)}
.step h3{font-size:18px;font-weight:500}
.step p{color:var(--gray);font-size:15px;max-width:22em}

/* ---------- Đánh giá ---------- */
.rev{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);box-shadow:var(--sh-1);margin:0}
.rev.ph-card{background:transparent;border-style:dashed;border-color:#D6CFC0;box-shadow:none}
.rev .ph{align-self:flex-start}
.rev .stars{display:flex;gap:2px;color:var(--gold)}.rev .stars svg{width:16px;height:16px}
.rev blockquote{margin:0;font-size:16px;line-height:1.65}
.rev.ph-card blockquote{color:var(--gray)}
.rev .who{display:flex;align-items:center;gap:var(--s3);margin-top:auto}
.rev .av{width:40px;height:40px;border-radius:50%;background:var(--ivory);border:1px solid var(--line);object-fit:cover;flex:none}
.rev .who b{display:block;font-weight:500;font-size:15px}.rev .who small{color:var(--gray);font-size:13px}

/* ---------- CTA cuối ---------- */
.cta{border-radius:28px;overflow:hidden;position:relative;background:var(--black);color:var(--on-dark);padding:clamp(48px,7vw,88px) var(--gutter);text-align:center}
.cta::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 120%,rgba(18,51,47,.95),transparent 70%),radial-gradient(30% 40% at 50% 100%,rgba(221,182,106,.10),transparent 70%);pointer-events:none}
.cta>*{position:relative}
.cta h2{font-size:var(--h2);line-height:1.15}
.cta p{margin:var(--s4) auto 0;color:var(--on-dark-2);font-weight:300;font-size:17px}
.cta .btn{margin-top:var(--s6)}

/* ---------- Footer ---------- */
.ftr{background:var(--black);color:var(--on-dark-2);padding-block:var(--s8) calc(var(--s6) + env(safe-area-inset-bottom));font-size:14px}
.ftr-top{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:var(--s7)}
.ftr .logo{color:var(--on-dark)}.ftr .logo b{color:var(--on-dark-2)}
.ftr-about p{margin-top:var(--s4);max-width:30em;line-height:1.65}
.ftr h4{margin:0 0 var(--s3);font-size:14px;font-weight:500;color:var(--on-dark)}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ftr ul a{display:inline-flex;align-items:center;min-height:40px;transition:color .2s}
.ftr ul a:hover{color:var(--on-dark)}
.soc{display:flex;gap:var(--s2);margin-top:var(--s5)}
.soc a{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-d);display:grid;place-items:center;color:var(--on-dark);transition:border-color .2s,background .2s}
.soc a:hover{border-color:#4a5255;background:#12171A}
.soc svg{width:18px;height:18px}
.ftr-bot{margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid var(--line-d);display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s3);font-size:13px}

/* ---------- Trang con ---------- */
.page-head{padding-block:var(--s8) var(--s6)}
.page-head h1{font-size:var(--h1);line-height:1.08;margin-top:var(--s3)}
.page-head p{margin-top:var(--s4);color:var(--gray);font-size:17px;max-width:36em}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-bottom:var(--s6)}
.toolbar .field{flex:1 1 280px;max-width:420px}
.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 18px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--white);font-size:14px;cursor:pointer;transition:background .2s,border-color .2s}
.chip:hover{border-color:#D4CEC2}
.chip[aria-pressed="true"]{background:var(--black);color:var(--on-dark);border-color:var(--black)}
.empty{grid-column:1/-1;text-align:center;padding:var(--s8) var(--s4);color:var(--gray)}
.empty b{display:block;color:var(--ink);font-weight:500;font-size:18px;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--gray);font-size:14px;min-height:44px;margin-top:var(--s4)}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}

/* chi tiết sản phẩm */
.pd{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--s7);align-items:start;padding-bottom:var(--s9);margin-top:var(--s4)}
.pd-main{display:grid;gap:var(--s5)}
.pd-main .media{border-radius:var(--r-box);border:1px solid var(--line)}
.box{background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);padding:var(--s6)}
.box h2{font-size:20px;margin-bottom:var(--s4);letter-spacing:-.01em}
.box p{color:var(--ink-2)}
.box .ticks li{font-size:15px}
details{border-top:1px solid var(--line)}details:first-of-type{border-top:0}
summary{cursor:pointer;list-style:none;padding:14px 36px 14px 0;font-weight:500;position:relative;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;right:6px;top:50%;width:9px;height:9px;border-right:1.5px solid var(--gray);border-bottom:1.5px solid var(--gray);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
details p{padding-bottom:16px;color:var(--gray)}
.buy{position:sticky;top:88px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);padding:var(--s6);box-shadow:var(--sh-1);display:grid;gap:var(--s4)}
.buy h1{font-size:clamp(24px,2.4vw,32px);line-height:1.2}
.buy .sub{color:var(--gray)}
.buy .price{font-size:30px}
.pk{display:grid;gap:var(--s2)}
.pk button{text-align:left;border:1px solid var(--line);background:var(--white);border-radius:var(--r-input);padding:12px 14px;cursor:pointer;min-height:48px;display:flex;justify-content:space-between;gap:var(--s3)}
.pk button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.pk small{color:var(--gray)}
.trust{list-style:none;margin:0;padding:var(--s4) 0 0;border-top:1px solid var(--line);display:grid;gap:10px;font-size:14px;color:var(--ink-2)}
.trust li{display:flex;gap:10px;align-items:flex-start}.trust svg{width:18px;height:18px;flex:none;color:var(--emerald);margin-top:2px}
.ask{font-size:14px;color:var(--gray)}.ask a{color:var(--ink);font-weight:500;border-bottom:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px var(--gutter) calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:var(--s3)}
.bar .price{font-size:18px}
.bar .btn{flex:1;min-width:0}

/* ---------- Responsive ---------- */

}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const sv=(d,w=1.6)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={

/* ---------- dữ liệu: site.json, products.json, posts.json ---------- */
let SITE={},PRODUCTS=[],POSTS=[],LIST_Q="",LIST_CAT="";
const HC=()=>SITE.trang_chu||{};
const NAME=()=>SITE.ten_web||"SONA AI";
const zaloUrl=()=>SITE.zalo?"https://zalo.me/"+String(SITE.zalo).replace(/\D/g,""):"";
const httpsOk=u=>/^https:\/\//.test(u||"");
const CATS=["App","Tài liệu","Khóa học","Dịch vụ"];
const catOf=p=>/app/i.test(p.loai||"")?"App":/khóa học|khoa hoc/i.test(p.loai||"")?"Khóa học":/dịch vụ|dich vu/i.test(p.loai||"")?"Dịch vụ":"Tài liệu";
const catIcon=p=>({App:I.app,"Khóa học":I.course,"Dịch vụ":I.svc}[catOf(p)]||I.doc);
const typeLabel=p=>p.loai_hien_thi||catOf(p);
const shortName=p=>p.ten_ngan||String(p.ten||"").split(":")[0].trim();
const fmt=n=>Number(n).toLocaleString("vi-VN")+"đ";
const priceOf=g=>g?(g.so_tien?fmt(g.so_tien):String(g.gia||"").split("(")[0].trim()):"";
/* chỉ hiện giá gốc gạch ngang khi dữ liệu có gia_niem_yet lớn hơn giá bán */
const realSale=g=>g&&g.so_tien&&g.gia_niem_yet&&g.gia_niem_yet>g.so_tien;
const priceHtml=g=>esc(priceOf(g))+(realSale(g)?`<s>${fmt(g.gia_niem_yet)}</s>`:"");
const soon=p=>!!p.sap_ra_mat;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2000)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Đã sao chép")}catch(e){toast("Bấm giữ vào chữ để sao chép")}}

async function load(){
  try{[SITE,PRODUCTS]=await Promise.all([fetch("site.json",{cache:"no-cache"}).then(r=>r.json()),fetch("products.json",{cache:"no-cache"}).then(r=>r.json())])}catch(e){SITE={};PRODUCTS=[]}
  try{POSTS=await fetch("posts.json",{cache:"no-cache"}).then(r=>r.json());POSTS.sort((a,b)=>String(b.ngay).localeCompare(String(a.ngay)))}catch(e){POSTS=[]}
  chrome();route()}

/* ---------- khung chung: header, menu, tìm kiếm, footer ---------- */
function chrome(){
  $("#openSearch").innerHTML=I.search;$("#menuBtn").innerHTML=I.menu;$("#sField").insertAdjacentHTML("afterbegin",I.search);
  if(zaloUrl()){const c=$("#contactTop");c.href=zaloUrl();c.target="_blank";c.rel="noopener";
    const f=$("#fab");f.href=zaloUrl();f.innerHTML=I.chat+"Hỏi Zalo";f.hidden=false}
  const NAV=[["san-pham","Sản phẩm"],["hoc","Học AI"],["cong-dong","Cộng đồng"],["ho-tro","Hỗ trợ"]];
  $("#drawer").innerHTML=NAV.map(([h,t])=>`<a class="item" href="#${h}">${t}${I.arrow}</a>`).join("")+
    (zaloUrl()?`<a class="btn btn-primary btn-block" href="${zaloUrl()}" target="_blank" rel="noopener">${I.chat}Liên hệ qua Zalo</a>`:"");
  $("#menuBtn").onclick=()=>toggleMenu();
  $$("#drawer a").forEach(a=>a.addEventListener("click",()=>toggleMenu(false)));
  $("#openSearch").onclick=openSearch;
  const q=$("#sq");q.oninput=drawSugg;
  q.onkeydown=e=>{if(e.key==="Enter"){LIST_Q=q.value.trim();LIST_CAT="";closeSearch();if(location.hash==="#san-pham")route();else location.hash="san-pham"}};
  $("#searchOv").onclick=e=>{if(e.target.id==="searchOv")closeSearch()};
  footer()}
function toggleMenu(open){const d=$("#drawer");const o=open??d.hidden;if(!o&&d.hidden)return;d.hidden=!o;
  const b=$("#menuBtn");b.setAttribute("aria-expanded",o);b.setAttribute("aria-label",o?"Đóng menu":"Mở menu");b.innerHTML=o?I.close:I.menu;document.body.style.overflow=o?"hidden":""}
function openSearch(){toggleMenu(false);$("#searchOv").hidden=false;const q=$("#sq");q.value="";drawSugg();setTimeout(()=>q.focus(),30)}
function closeSearch(){$("#searchOv").hidden=true}
const matchP=words=>p=>{const hay=norm([p.ten,p.phu_de,p.mo_ta_ngan,p.loai,p.loai_hien_thi,p.cho_ai,...(p.loi_ich||[])].join(" "));return words.every(w=>hay.includes(w))};
function drawSugg(){const words=norm($("#sq").value).split(/\s+/).filter(Boolean);
  const list=(words.length?PRODUCTS.filter(matchP(words)):PRODUCTS).slice(0,6);
  $("#sugg").innerHTML=list.length?list.map(p=>`<a href="#sp/${esc(p.slug)}"><span>${esc(shortName(p))}</span><small>${esc(typeLabel(p))}</small></a>`).join(""):`<div class="none">Chưa có sản phẩm phù hợp. Anh chị thử từ khóa khác.</div>`;
  $$("#sugg a").forEach(a=>a.onclick=closeSearch)}
function footer(){const S=SITE.mang_xa_hoi||{};
  const soc=[[S.facebook,I.fb,"Facebook"],[S.tiktok,I.tt,"TikTok"],[S.youtube,I.yt,"YouTube"]].filter(x=>httpsOk(x[0]));
  $("#ftr").innerHTML=`<div class="wrap"><div class="ftr-top">
    <div class="ftr-about"><a class="logo" href="#"><img src="img/mark-192.png" alt="" width="32" height="32"><span>SONA<b>AI</b></span></a>
      <p>${esc(SITE.khau_hieu||"Công cụ AI đơn giản cho người kinh doanh bận rộn")}. App, tài liệu và khóa học cho spa, salon, shop và hộ kinh doanh.</p>
      ${soc.length?`<div class="soc">${soc.map(([u,ic,n])=>`<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${n}">${ic}</a>`).join("")}</div>`:""}</div>
    <div><h4>Khám phá</h4><ul><li><a href="#san-pham">Sản phẩm</a></li><li><a href="#hoc">Học AI</a></li><li><a href="#cong-dong">Cộng đồng</a></li><li><a href="#ho-tro">Hỗ trợ</a></li></ul></div>
    <div><h4>Liên hệ</h4><ul>${SITE.zalo?`<li><a href="${zaloUrl()}" target="_blank" rel="noopener">Zalo ${esc(SITE.zalo)}</a></li>`:""}${SITE.hotline?`<li><a href="tel:${esc(SITE.hotline.replace(/[^\d+]/g,""))}">Hotline ${esc(SITE.hotline)}</a></li>`:""}${SITE.email?`<li><a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a></li>`:""}<li><a href="#ho-tro">Hướng dẫn mua hàng</a></li></ul></div>
  </div><div class="ftr-bot"><span>© ${new Date().getFullYear()} ${esc(NAME())}</span><span>${esc(SITE.slogan||"")}</span></div></div>`}

/* ---------- định tuyến ---------- */
function route(){const h=location.hash;closePay();closeSearch();toggleMenu(false);
  const sp=h.match(/^#sp\/([\w-]+)/),bai=h.match(/^#bai\/([\w-]+)/),hf=h.match(/^#hoc\/(.+)$/);
  const p=sp&&PRODUCTS.find(x=>x.slug===sp[1]),a=bai&&POSTS.find(x=>x.slug===bai[1]);
  const sec=p?"san-pham":(a||/^#hoc/.test(h))?"hoc":/^#san-pham/.test(h)?"san-pham":/^#cong-dong/.test(h)?"cong-dong":/^#(ho-tro|thong-tin)/.test(h)?"ho-tro":"";
  $$(".nav a").forEach(x=>x.classList.toggle("on",x.dataset.nav===sec));
  document.body.classList.toggle("pdp",!!p);

  </article></div>`;$$("#app [data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp))}

  </div></div>`}

    ["Bao lâu thì nhận được sản phẩm?","SONA kiểm tra tiền về rồi gửi sản phẩm qua Zalo trong giờ làm việc 8h–20h hằng ngày."],
